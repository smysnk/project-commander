{{- $secret := default (dict) .Values.controlPlane.server.secret -}}
{{- if and (not .Values.controlPlane.existingServerSecret) (gt (len $secret) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "project-commander.serverSecretName" . }}
  labels:
    {{- include "project-commander.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  {{- range $key := keys $secret | sortAlpha }}
  {{ $key }}: {{ printf "%v" (index $secret $key) | quote }}
  {{- end }}
{{- end }}
